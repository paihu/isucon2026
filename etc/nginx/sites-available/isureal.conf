# 2MB 以上。正規のプロフィール画像（512x512 以下）は最大 26KB 程度で、不正アップロードは平均 24MB だった。
map $http_content_length $isureal_profile_body_too_large {
  default 0;
  "~^[0-9]{8,}$" 1;
  "~^[2-9][0-9]{6}$" 1;
}

# 作成した画像の本体は受けたサーバーが持つので、DB と同居して CPU に余裕のない asia2 には作成を回さない。
upstream isureal_local {
  server 127.0.0.1:8080;
  keepalive 32;
}

map "$request_method $uri" $isureal_upstream {
  default isureal_app;
  "~^POST /api/posts(/[^/]+/realmojis)?$" isureal_local;
}

server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 32m;
  root /home/isucon/webapp/public;

  location /api/ {
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_pass http://$isureal_upstream;
  }

  # 最大 32MB の不正画像を asia2 へ転送すると、DB と同居する asia2 の CPU と帯域を使うため。
  location = /api/me/profile-image {
    # 巨大な本文はアプリに渡さず、空の本文として渡す。アプリは不正画像と同じ 400 を返し、guard 向けのログも出す。
    error_page 418 = @profile_image_without_body;
    if ($isureal_profile_body_too_large) {
      return 418;
    }
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_pass http://isureal_local;
  }

  location @profile_image_without_body {
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Content-Length "0";
    proxy_pass_request_body off;
    proxy_pass http://isureal_local;
  }

  location / {
    try_files $uri /index.html;
  }
}
