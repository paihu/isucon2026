# GC の回数を減らす（ベンチ中 asia1 の各ワーカーで約 3 秒、Ruby の CPU の約 5%）。
# malloc の閾値（既定 16MB）で起きる GC と、初期ヒープが小さいことによる GC を減らす。
[Service]
Environment=RUBY_GC_HEAP_0_INIT_SLOTS=600000 RUBY_GC_HEAP_1_INIT_SLOTS=300000 RUBY_GC_HEAP_2_INIT_SLOTS=100000
Environment=RUBY_GC_MALLOC_LIMIT=67108864 RUBY_GC_MALLOC_LIMIT_MAX=268435456
Environment=RUBY_GC_OLDMALLOC_LIMIT=134217728 RUBY_GC_OLDMALLOC_LIMIT_MAX=536870912
